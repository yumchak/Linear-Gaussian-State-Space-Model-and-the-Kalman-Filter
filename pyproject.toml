[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lgssm"
version = "0.1.0"
description = "Kalman filtering for linear-Gaussian state space models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # A numerics library should not be warning at all, so make it an error.
    "error",
    # Except: numpy 2.0 on Apple's Accelerate BLAS raises spurious floating
    # point flags in matmul, on finite, well-conditioned input.  Not ours.
    "ignore:.*encountered in matmul:RuntimeWarning",
]
